name: Feature CI

on:
  push:
    branches:
      - feature/unit-academic-scores-achievements

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Composer dependencies
        run: composer update --with-all-dependencies --no-interaction --prefer-dist
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --force
      - name: Run tests
        run: php artisan test
