name: SPMB CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# CI validates committed dependencies and never pushes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer definition and lockfile
        run: composer validate --no-check-publish

      - name: Install Composer dependencies from lockfile
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: find app database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare application
        env:
          CACHE_STORE: array
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --force

      - name: Run tests
        run: php artisan test
