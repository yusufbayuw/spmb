name: SPMB CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# CI validates committed dependencies and never pushes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer definition and lockfile
        run: composer validate --no-check-publish

      - name: Install Composer dependencies from lockfile
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: find app database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare application
        env:
          CACHE_STORE: array
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --force

      - name: Run tests
        run: php artisan test

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_testing_only
          MYSQL_DATABASE: spmb_test
          MYSQL_USER: spmb
          MYSQL_PASSWORD: spmb_testing_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_testing_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: spmb_test
      DB_USERNAME: spmb
      DB_PASSWORD: spmb_testing_only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP with MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, gd
          coverage: none

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Run phase-one MySQL regression tests
        run: |
          php artisan test \
            tests/Feature/PhaseOneUnitBoundaryTest.php \
            tests/Feature/PhaseOneStaffSessionTest.php \
            tests/Feature/PhaseOneOperationalResetTest.php \
            tests/Feature/PhaseOneAuthorizationRegressionTest.php \
            tests/Feature/PhaseOneHistoricalAuditTest.php \
            tests/Feature/ReleasePreflightTest.php \
            tests/Feature/AuditTrailTest.php

      # Synthetic environment only: this does NOT contact real staging
      # services, send email, start queue workers, or validate backups.
      - name: Rehearse staging release preflight (isolated CI database)
        env:
          APP_ENV: staging
          APP_DEBUG: 'false'
          APP_URL: https://staging.example.test
          SESSION_DRIVER: database
          SESSION_SECURE_COOKIE: 'true'
          QUEUE_CONNECTION: database
          MAIL_MAILER: smtp
          MAIL_FROM_ADDRESS: noreply@example.test
          SPMB_UPLOAD_REQUIRE_MALWARE_SCAN: 'true'
          SPMB_RESET_ALLOWED_TARGET: ''
        run: |
          set -o pipefail
          php artisan spmb:release:preflight --profile=staging --json | tee staging-preflight.json

      - name: Upload synthetic preflight report
        uses: actions/upload-artifact@v4
        with:
          name: staging-preflight-synthetic
          path: staging-preflight.json
          retention-days: 14
